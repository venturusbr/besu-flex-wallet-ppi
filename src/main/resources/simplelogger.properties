# slf4j-simple configuration. Picked up automatically when the file is on the classpath at
# /simplelogger.properties — i.e. dropped into src/main/resources/.
#
# Default log level for any logger that doesn't have its own override below. Use trace, debug,
# info, warn, or error. "warn" keeps web3j / Apache HttpClient / tuweni quiet on a healthy run
# while still surfacing genuine problems.
org.slf4j.simpleLogger.defaultLogLevel=warn

# Per-package overrides — uncomment to debug:
# org.slf4j.simpleLogger.log.org.apache.hc=info
# org.slf4j.simpleLogger.log.org.web3j=debug

# Output formatting.
org.slf4j.simpleLogger.showDateTime=false
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showLogName=true
org.slf4j.simpleLogger.showShortLogName=true
org.slf4j.simpleLogger.levelInBrackets=true
